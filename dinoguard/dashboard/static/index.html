<html lang="en">
<head>
<meta charset="utf-8">

<title>DinoGuard</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="shell">
  <nav class="side">
    <div class="brand"><span class="dot">⣾⣿⣷</span> DinoGuard</div>
    <a href="#/home">Home</a>
    <a href="#/sessions">Sessions</a>
    <a href="#/compare">Compare</a>
    <a href="#/live">Live</a>

    <a href="#/insights">Findings &amp; insights</a>

    <div class="hint">Ctrl+J · ask anything</div>
  </nav>
  <main id="view"><p class="muted">Loading…</p></main>
</div>
<aside id="dock" class="dock hidden" aria-label="Assistant">
  <div class="dock-head"><b>Ask your data</b><button id="dock-close" class="ghost">✕</button></div>
  <div id="dock-log" class="dock-log"></div>
  <form id="dock-form"><input id="dock-q" placeholder="which sessions burned the most tokens this week?" autocomplete="off"><button>Ask</button></form>
  <p class="muted small">Answers are investigation aids. The SQL is shown so you can check it.</p>
</aside>
<div id="tooltip" class="tooltip hidden"></div>
<script src="/static/app.js"></script>
<script src="/static/charts.js"></script>
