    context_window: 200000
  - match: sonnet-5-5
    input: 2.0
    output: 10.0
    cache_read: 0.1
    cache_write: 2.5
    context_window: 1000000
  - match: sonnet-5
    input: 2.0
    output: 10.0
    cache_read: 0.2
    cache_write: 2.5
    context_window: 1000000
  - match: sonnet-4-6
    input: 3.0
