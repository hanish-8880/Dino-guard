# USD per 1M tokens + context window, matched by substring of the model id (first match wins, so the more
# specific ids come first). Claude prices are Anthropic first-party API list prices as of 2026-11 (input/output
# and the listed cache-read prices); cache_write is the 5-minute cache write at 1.25x input. Where no cache-read
# price is listed, it is estimated at 0.1x input. Subscription plans (Pro/Max) are not billed per token, so for
# them this is "what it would cost on the API".
# Your copy lives in ~/.dinoguard/prices.yaml. Edit it to match your provider's current price sheet; stored
# costs are recalculated automatically when this table changes.
version: 2
models:
  - match: fable-5-2
    input: 8.0
    output: 40.0
    cache_read: 0.2
    cache_write: 10.0
    context_window: 1000000
  - match: mythos-5-2
    input: 8.0
    output: 40.0
    cache_read: 0.2
    cache_write: 10.0
    context_window: 1000000
  - match: fable
    input: 10.0
    output: 50.0
    cache_read: 1.0
    cache_write: 12.5
    context_window: 1000000
  - match: mythos
    input: 10.0
    output: 50.0
    cache_read: 1.0
    cache_write: 12.5
    context_window: 1000000
  - match: opus-5-5
    input: 4.0
    output: 20.0
