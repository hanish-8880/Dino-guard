# USD per 1M tokens + context window, matched by substring of the model id (first match wins).
# These are ESTIMATES - edit ~/.dinoguard/prices.yaml (copied from this file on first use)
# to match your provider's current price sheet.
models:
  - match: opus
    input: 15.0
    output: 75.0
    cache_read: 1.5
    cache_write: 18.75
    context_window: 200000
  - match: sonnet
    input: 3.0
    output: 15.0
    cache_read: 0.3
    cache_write: 3.75
    context_window: 200000
  - match: haiku
    input: 1.0
    output: 5.0
    cache_read: 0.1
    cache_write: 1.25
    context_window: 200000
  - match: fable
    input: 3.0
    output: 15.0
    cache_read: 0.3
    cache_write: 3.75
    context_window: 200000
  - match: gpt-4o-mini
    input: 0.15
    output: 0.6
    cache_read: 0.075
    cache_write: 0.15
    context_window: 128000
  - match: gpt-4o
    input: 2.5
    output: 10.0
    cache_read: 1.25
    cache_write: 2.5
    context_window: 128000
default:
  input: 3.0
  output: 15.0
  cache_read: 0.3
  cache_write: 3.75
  context_window: 200000
